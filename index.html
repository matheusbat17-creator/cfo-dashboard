<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>CFO Pessoal - Dashboard</title>
<style>
  :root {
    --surface-0: #f4f4f5;
    --surface-1: #ffffff;
    --surface-2: #fafafa;
    --text-primary: #18181b;
    --text-secondary: #52525b;
    --text-muted: #a1a1aa;
    --border: #e4e4e7;
    --border-strong: #d4d4d8;
    --border-accent: #1D9E75;
    --bg-accent: #e6f6f0;
    --text-accent: #0f7a56;
    --bg-success: #e6f6f0;
    --text-success: #0f7a56;
    --bg-warning: #fdf3e3;
    --text-warning: #a3660f;
    --radius: 10px;
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --surface-0: #121214;
      --surface-1: #1c1c1f;
      --surface-2: #232326;
      --text-primary: #f4f4f5;
      --text-secondary: #b0b0b5;
      --text-muted: #7a7a80;
      --border: #333338;
      --border-strong: #45454a;
      --border-accent: #1D9E75;
      --bg-accent: #123528;
      --text-accent: #3fd6a0;
      --bg-success: #123528;
      --text-success: #3fd6a0;
      --bg-warning: #3a2c10;
      --text-warning: #e0a940;
    }
  }
  :root[data-theme="dark"] {
    --surface-0: #121214;
    --surface-1: #1c1c1f;
    --surface-2: #232326;
    --text-primary: #f4f4f5;
    --text-secondary: #b0b0b5;
    --text-muted: #7a7a80;
    --border: #333338;
    --border-strong: #45454a;
    --border-accent: #1D9E75;
    --bg-accent: #123528;
    --text-accent: #3fd6a0;
    --bg-success: #123528;
    --text-success: #3fd6a0;
    --bg-warning: #3a2c10;
    --text-warning: #e0a940;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--surface-0);
    font-family: var(--font-sans);
  }
  body {
    padding: 16px;
    padding-top: calc(16px + env(safe-area-inset-top, 0px));
    padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  }
  select, input, button {
    font-family: var(--font-sans);
    background: var(--surface-1);
    color: var(--text-primary);
    border: 0.5px solid var(--border);
    border-radius: 6px;
    padding: 6px 8px;
    font-size: 13px;
  }
  #root { max-width: 760px; margin: 0 auto; }
</style>
</head>
<body>
<div id="root"></div>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel" data-type="module">
const { useState, useMemo, useEffect } = React;

// Fonte de dados: Supabase (projeto cfo-pessoal). Chave "anon" — só leitura pública
// e inserção restrita por RLS (ver policy "anon can insert manual expenses"); nunca
// usar a service_role key aqui, pois este arquivo é publicado e fica visível a quem
// tiver o link.
const SUPABASE_URL = "https://ygyifpcpweguurdyrnmm.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_t1sQvkdv8qxrDc7DhSmRQA_zlIsQg6H";
const SUPABASE_HEADERS = {
  apikey: SUPABASE_ANON_KEY,
  Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
  "Content-Type": "application/json",
};

const SALARY_OLD = 3140;
const SALARY = 3511.65; // líquido real do holerite (bruto R$3.900)
const salaryOf = (id) => (id === "dez26" ? SALARY : SALARY_OLD);
const TERREIRO = 127;
const BUFFER = 1000;

const CATEGORIES = {
  essencial: { label: "Essencial", color: "#1D9E75" },
  compromisso: { label: "Compromisso", color: "#378ADD" },
  cortavel: { label: "Cortável", color: "#D85A30" },
  delivery_restaurante: { label: "Delivery/Restaurante", color: "#E24B4A" },
  compras_online: { label: "Compras online", color: "#D4537E" },
  uber: { label: "Uber", color: "#534AB7" },
  combustivel: { label: "Combustível", color: "#888780" },
  cuidados_pessoais: { label: "Cuidados pessoais", color: "#BA7517" },
  vestuario: { label: "Vestuário", color: "#639922" },
  presente: { label: "Presentes", color: "#9B59B6" },
  viagem: { label: "Viagem/Carnaval", color: "#185FA5" },
  outros: { label: "Outros/Diversos", color: "#5F5E5A" },
};

const CYCLES = [
  { id: "mar26", label: "Mar/26", period: "27/01 → 23/02", venc: "01/03/2026" },
  { id: "abr26", label: "Abr/26", period: "24/02 → 25/03", venc: "01/04/2026" },
  { id: "mai26", label: "Mai/26", period: "26/03 → 24/04", venc: "01/05/2026" },
  { id: "jun26", label: "Jun/26", period: "25/04 → 25/05", venc: "01/06/2026" },
  { id: "jul26", label: "Jul/26", period: "26/05 → 24/06", venc: "01/07/2026" },
  { id: "ago26", label: "Ago/26", period: "25/06 → 27/07", venc: "01/08/2026" },
  { id: "set26", label: "Set/26", period: "28/07 → 25/08", venc: "01/09/2026" },
  { id: "out26", label: "Out/26", period: "26/08 → 24/09", venc: "01/10/2026" },
  { id: "nov26", label: "Nov/26", period: "25/09 → 26/10", venc: "01/11/2026" },
  { id: "dez26", label: "Dez/26", period: "27/10 → 24/11", venc: "01/12/2026" },
];

const initialExpenses = []; // dados reais agora vivem no Supabase (tabela expenses); ver fetch no Dashboard()

const GOALS = [
  { id: "reserva", name: "Reserva de emergência", target: 6600, saved: 6600, deadline: "Concluída", priority: "Alta" },
  { id: "carro", name: "Troca de carro (piso)", target: 10000, saved: 6829, deadline: "Jan/2027", priority: "Alta" },
  { id: "viagem", name: "Viagem Carnaval RJ", target: 3000, saved: 500, deadline: "Fev/2027", priority: "Alta" },
];

const CHECKPOINTS = [
  { cycle: "Set/26", target: 7421 },
  { cycle: "Out/26", target: 8021 },
  { cycle: "Nov/26", target: 8626 },
  { cycle: "Dez/26", target: 9238 },
  { cycle: "Jan/27", target: 9857 },
];

const META_APORTE = 640;
const GYMPASS = 99; // repasse mensal à namorada (fora do cartão)

// Previsão: só despesas fixas mapeadas + parcelas restantes. [nome, valor no cartão, reembolso]
const FIXAS = [
  ["MAPFRE Seguro", 209.89, 0],
  ["Claude + IOF", 121.77, 0],
  ["Espaço Laser", 114.99, 0],
  ["HTM Comunidade (namorada paga metade)", 97.14, 48.57],
  ["TIM", 66.99, 0],
  ["HBO Max", 29.90, 0],
  ["Spotify", 23.90, 0],
  ["Amazon Prime", 19.90, 0],
  ["MP Melimais", 19.90, 0],
  ["Google", 9.99, 0],
  ["iFood", 7.95, 0],
  ["Apple iCloud", 5.90, 0],
];
const FORECAST = [
  { id: "jan27", label: "Jan/27", period: "25/11 → 24/12", venc: "01/01/2027", dias: 30, parcelas: [
    ["Ticketmaster 5/6", 83.33, 0], ["ML bota 4/4", 38.39, 0], ["ML ayumi 2/2 (irmão paga metade)", 83.76, 41.88],
    ["Thaisio 2/3", 106.19, 0], ["AmericanFlex 3/5 (mãe reembolsa)", 345.80, 345.80] ] },
  { id: "fev27", label: "Fev/27", period: "25/12 → 24/01", venc: "01/02/2027", dias: 31, parcelas: [
    ["Ticketmaster 6/6", 83.33, 0], ["Thaisio 3/3", 106.19, 0], ["AmericanFlex 4/5 (mãe reembolsa)", 345.80, 345.80] ] },
  { id: "mar27", label: "Mar/27", period: "25/01 → 24/02", venc: "01/03/2027", dias: 31, parcelas: [
    ["AmericanFlex 5/5 (mãe reembolsa)", 345.80, 345.80] ] },
];

const fmt = (v) => v.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
const fmtShort = (v) => v.toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

function MetricCard({ label, value, sub, color }) {
  return (
    <div style={{ background: "var(--surface-1)", borderRadius: "var(--radius)", padding: "12px 16px", flex: "1 1 140px", minWidth: 0 }}>
      <p style={{ fontSize: 12, color: "var(--text-muted)", margin: "0 0 2px", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{label}</p>
      <p style={{ fontSize: 22, fontWeight: 500, margin: 0, color: color || "var(--text-primary)" }}>{value}</p>
      {sub && <p style={{ fontSize: 11, color: "var(--text-muted)", margin: "2px 0 0" }}>{sub}</p>}
    </div>
  );
}

function ProgressBar({ pct, color }) {
  const clamped = Math.min(100, Math.max(0, pct));
  return (
    <div style={{ background: "var(--surface-0)", borderRadius: 4, height: 8, width: "100%", overflow: "hidden" }}>
      <div style={{ width: `${clamped}%`, height: "100%", background: color || "#1D9E75", borderRadius: 4, transition: "width 0.3s" }} />
    </div>
  );
}

function Pill({ label, active, onClick, color }) {
  return (
    <button onClick={onClick} style={{
      padding: "4px 12px", borderRadius: 20, fontSize: 12, border: active ? "none" : "0.5px solid var(--border)",
      background: active ? (color || "var(--text-primary)") : "transparent",
      color: active ? "#fff" : "var(--text-secondary)", cursor: "pointer", whiteSpace: "nowrap", fontWeight: active ? 500 : 400, transition: "all 0.15s"
    }}>{label}</button>
  );
}

function Dashboard() {
  const [expenses, setExpenses] = useState(initialExpenses);
  const [loadError, setLoadError] = useState(null);
  const [loading, setLoading] = useState(true);
  const [filterCycle, setFilterCycle] = useState("all");
  const [filterCat, setFilterCat] = useState("all");
  const [tab, setTab] = useState("overview");
  const [metaAporte, setMetaAporte] = useState(META_APORTE);
  const [overviewCycle, setOverviewCycle] = useState("all");
  const [selectedCat, setSelectedCat] = useState(null);
  const [showForm, setShowForm] = useState(false);
  const [form, setForm] = useState({ cycle: "dez26", date: "", desc: "", value: "", cat: "outros" });

  const loadExpenses = async () => {
    try {
      const res = await fetch(
        `${SUPABASE_URL}/rest/v1/expenses?select=id,cycle,date_label,description,value,category,installment,status,source,created_at&order=created_at.asc`,
        { headers: SUPABASE_HEADERS }
      );
      if (!res.ok) throw new Error(`Supabase respondeu ${res.status}`);
      const rows = await res.json();
      setExpenses(rows.map(r => ({
        id: r.id,
        cycle: r.cycle,
        date: r.date_label,
        desc: r.description,
        value: Number(r.value),
        cat: r.category,
        parcela: r.installment || undefined,
        status: r.status,
        source: r.source,
      })));
      setLoadError(null);
    } catch (err) {
      setLoadError("Não foi possível carregar os dados do Supabase — mostrando apenas o que já estava na tela. " + err.message);
    } finally {
      setLoading(false);
    }
  };

  useEffect(() => { loadExpenses(); }, []);

  const filtered = useMemo(() => {
    return expenses.filter(e => {
      if (filterCycle !== "all" && e.cycle !== filterCycle) return false;
      if (filterCat !== "all" && e.cat !== filterCat) return false;
      return true;
    });
  }, [expenses, filterCycle, filterCat]);

  const totalFiltered = useMemo(() => filtered.reduce((s, e) => s + e.value, 0), [filtered]);

  const byCycleTotals = useMemo(() => {
    const m = {};
    CYCLES.forEach(c => { m[c.id] = 0; });
    expenses.forEach(e => { m[e.cycle] = (m[e.cycle] || 0) + e.value; });
    return m;
  }, [expenses]);

  const byCatTotals = useMemo(() => {
    const activeCycleFilter = tab === "overview" ? overviewCycle : filterCycle;
    const src = activeCycleFilter === "all" ? expenses : expenses.filter(e => e.cycle === activeCycleFilter);
    const m = {};
    src.forEach(e => { m[e.cat] = (m[e.cat] || 0) + e.value; });
    return Object.entries(m).sort((a, b) => b[1] - a[1]);
  }, [expenses, filterCycle, overviewCycle, tab]);

  const deliveryByCycle = useMemo(() => {
    const m = {};
    CYCLES.forEach(c => { m[c.id] = 0; });
    expenses.filter(e => e.cat === "delivery_restaurante").forEach(e => { m[e.cycle] = (m[e.cycle] || 0) + e.value; });
    return m;
  }, [expenses]);

  const aportes = useMemo(() => {
    return CYCLES.map(c => {
      const fat = byCycleTotals[c.id] || 0;
      const sobra = salaryOf(c.id) - fat;
      const aporte = Math.max(0, sobra - TERREIRO - BUFFER);
      return { ...c, fatura: fat, aporte };
    });
  }, [byCycleTotals]);

  const avgAporte = useMemo(() => {
    const sum = aportes.reduce((s, a) => s + a.aporte, 0);
    return sum / aportes.length;
  }, [aportes]);

  const avgFatura = useMemo(() => {
    const sum = aportes.reduce((s, a) => s + a.fatura, 0);
    return sum / aportes.length;
  }, [aportes]);

  const overviewFatura = useMemo(() => {
    if (overviewCycle === "all") return avgFatura;
    return byCycleTotals[overviewCycle] || 0;
  }, [overviewCycle, avgFatura, byCycleTotals]);

  const overviewAporte = useMemo(() => {
    if (overviewCycle === "all") return avgAporte;
    const fat = byCycleTotals[overviewCycle] || 0;
    return Math.max(0, SALARY - fat - TERREIRO - BUFFER);
  }, [overviewCycle, avgAporte, byCycleTotals]);

  const overviewDelivery = useMemo(() => {
    if (overviewCycle === "all") {
      const vals = Object.values(deliveryByCycle);
      return vals.reduce((s, v) => s + v, 0) / vals.length;
    }
    return deliveryByCycle[overviewCycle] || 0;
  }, [overviewCycle, deliveryByCycle]);

  const [savingExpense, setSavingExpense] = useState(false);
  const handleAddExpense = async () => {
    if (!form.date || !form.desc || !form.value) return;
    setSavingExpense(true);
    const payload = {
      cycle: form.cycle,
      date_label: form.date,
      description: form.desc,
      value: parseFloat(form.value),
      category: form.cat,
      source: "manual",
    };
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/expenses`, {
        method: "POST",
        headers: { ...SUPABASE_HEADERS, Prefer: "return=representation" },
        body: JSON.stringify(payload),
      });
      if (!res.ok) throw new Error(`Supabase respondeu ${res.status}`);
      await loadExpenses(); // recarrega do banco para manter o artifact e o Supabase sempre em sincronia
      setForm({ ...form, date: "", desc: "", value: "" });
      setShowForm(false);
    } catch (err) {
      alert("Não consegui salvar no Supabase: " + err.message + "\nTente novamente em alguns segundos.");
    } finally {
      setSavingExpense(false);
    }
  };

  const deliveryMeta = 100;
  const currentCycleDelivery = deliveryByCycle["ago26"] || 0;

  return (
    <div style={{ fontFamily: "var(--font-sans)", color: "var(--text-primary)", maxWidth: 720, margin: "0 auto" }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 16, flexWrap: "wrap", gap: 8 }}>
        <div>
          <h1 style={{ fontSize: 20, fontWeight: 500, margin: 0 }}>CFO Pessoal</h1>
          <p style={{ fontSize: 12, color: "var(--text-muted)", margin: "2px 0 0" }}>Salário R$ {fmtShort(SALARY)} · Ciclo 26→25</p>
        </div>
        <button onClick={() => setShowForm(!showForm)} style={{
          padding: "6px 14px", borderRadius: "var(--radius)", fontSize: 13, fontWeight: 500,
          border: "0.5px solid var(--border-strong)", background: "transparent", color: "var(--text-primary)", cursor: "pointer"
        }}>
          <span style={{ marginRight: 4 }}>+</span>
          Novo gasto
        </button>
      </div>

      {loadError && (
        <div style={{ background: "var(--bg-warning)", color: "var(--text-warning)", borderRadius: 8, padding: "8px 12px", fontSize: 12, marginBottom: 12 }}>
          ⚠️ {loadError}
        </div>
      )}
      {loading && (
        <p style={{ fontSize: 12, color: "var(--text-muted)", marginBottom: 12 }}>Carregando dados do Supabase…</p>
      )}

      {showForm && (
        <div style={{ background: "var(--surface-2)", border: "0.5px solid var(--border)", borderRadius: 12, padding: 16, marginBottom: 16 }}>
          <p style={{ fontSize: 14, fontWeight: 500, margin: "0 0 12px" }}>Adicionar gasto</p>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(140px, 1fr))", gap: 8 }}>
            <div>
              <label style={{ fontSize: 11, color: "var(--text-muted)" }}>Ciclo</label>
              <select value={form.cycle} onChange={e => setForm({ ...form, cycle: e.target.value })} style={{ width: "100%", marginTop: 2 }}>
                {CYCLES.map(c => <option key={c.id} value={c.id}>{c.label}</option>)}
              </select>
            </div>
            <div>
              <label style={{ fontSize: 11, color: "var(--text-muted)" }}>Data</label>
              <input placeholder="dd/mm" value={form.date} onChange={e => setForm({ ...form, date: e.target.value })} style={{ width: "100%", marginTop: 2 }} />
            </div>
            <div>
              <label style={{ fontSize: 11, color: "var(--text-muted)" }}>Valor (R$)</label>
              <input type="number" step="0.01" value={form.value} onChange={e => setForm({ ...form, value: e.target.value })} style={{ width: "100%", marginTop: 2 }} />
            </div>
            <div>
              <label style={{ fontSize: 11, color: "var(--text-muted)" }}>Categoria</label>
              <select value={form.cat} onChange={e => setForm({ ...form, cat: e.target.value })} style={{ width: "100%", marginTop: 2 }}>
                {Object.entries(CATEGORIES).map(([k, v]) => <option key={k} value={k}>{v.label}</option>)}
              </select>
            </div>
            <div style={{ gridColumn: "1 / -1" }}>
              <label style={{ fontSize: 11, color: "var(--text-muted)" }}>Descrição</label>
              <input value={form.desc} onChange={e => setForm({ ...form, desc: e.target.value })} style={{ width: "100%", marginTop: 2 }} />
            </div>
          </div>
          <div style={{ display: "flex", gap: 8, marginTop: 12 }}>
            <button disabled={savingExpense} onClick={handleAddExpense} style={{ padding: "6px 16px", borderRadius: "var(--radius)", fontSize: 13, fontWeight: 500, border: "0.5px solid var(--border-accent)", background: "var(--bg-accent)", color: "var(--text-accent)", cursor: savingExpense ? "default" : "pointer", opacity: savingExpense ? 0.6 : 1 }}>{savingExpense ? "Salvando…" : "Salvar"}</button>
            <button onClick={() => setShowForm(false)} style={{ padding: "6px 16px", borderRadius: "var(--radius)", fontSize: 13, border: "0.5px solid var(--border)", background: "transparent", color: "var(--text-secondary)", cursor: "pointer" }}>Cancelar</button>
          </div>
        </div>
      )}

      <div style={{ display: "flex", gap: 6, marginBottom: 16, flexWrap: "wrap" }}>
        <Pill label="Visão geral" active={tab === "overview"} onClick={() => setTab("overview")} />
        <Pill label="Gastos" active={tab === "expenses"} onClick={() => setTab("expenses")} />
        <Pill label="Metas" active={tab === "goals"} onClick={() => setTab("goals")} />
        <Pill label="Aportes" active={tab === "aportes"} onClick={() => setTab("aportes")} />
        <Pill label="Previsão" active={tab === "previsao"} onClick={() => setTab("previsao")} />
      </div>

      {tab === "overview" && (
        <>
          <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 12 }}>
            <Pill label="Todos" active={overviewCycle === "all"} onClick={() => setOverviewCycle("all")} />
            {CYCLES.map(c => <Pill key={c.id} label={c.label} active={overviewCycle === c.id} onClick={() => setOverviewCycle(c.id)} />)}
          </div>

          <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 16 }}>
            <MetricCard label={overviewCycle === "all" ? "Fatura média" : `Fatura ${CYCLES.find(c=>c.id===overviewCycle)?.label}`} value={fmt(overviewFatura)} sub={`${Math.round(overviewFatura / SALARY * 100)}% do salário`} />
            <MetricCard label={overviewCycle === "all" ? "Aporte médio" : "Aporte do ciclo"} value={fmt(overviewAporte)} sub={`Meta: R$ 640+`} color={overviewAporte >= 640 ? "#1D9E75" : "#E24B4A"} />
            <MetricCard label={overviewCycle === "all" ? "Delivery (média)" : "Delivery no ciclo"} value={fmt(overviewDelivery)} sub={`Meta: ${fmt(deliveryMeta)}`} color={overviewDelivery <= deliveryMeta ? "#1D9E75" : "#E24B4A"} />
          </div>

          <div style={{ background: "var(--surface-2)", border: "0.5px solid var(--border)", borderRadius: 12, padding: "16px 20px", marginBottom: 16 }}>
            <p style={{ fontSize: 14, fontWeight: 500, margin: "0 0 12px" }}>Fatura por ciclo</p>
            <div style={{ display: "flex", alignItems: "flex-end", gap: 6, height: 120 }}>
              {aportes.map(a => {
                const maxFat = Math.max(...aportes.map(x => x.fatura));
                const h = Math.max(8, (a.fatura / maxFat) * 100);
                const isHigh = a.fatura > salaryOf(a.id) * 0.5;
                return (
                  <div key={a.id} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 4 }}>
                    <span style={{ fontSize: 10, color: "var(--text-muted)" }}>{fmtShort(a.fatura)}</span>
                    <div style={{ width: "100%", height: h, background: isHigh ? "#E24B4A" : "#378ADD", borderRadius: "4px 4px 0 0", transition: "height 0.3s" }} />
                    <span style={{ fontSize: 10, color: "var(--text-muted)" }}>{a.label}</span>
                  </div>
                );
              })}
            </div>
          </div>

          <div style={{ background: "var(--surface-2)", border: "0.5px solid var(--border)", borderRadius: 12, padding: "16px 20px", marginBottom: 16 }}>
            <p style={{ fontSize: 14, fontWeight: 500, margin: "0 0 12px" }}>Delivery/Restaurante por ciclo (meta: {fmt(deliveryMeta)})</p>
            <div style={{ display: "flex", alignItems: "flex-end", gap: 6, height: 100 }}>
              {CYCLES.map(c => {
                const val = deliveryByCycle[c.id] || 0;
                const maxD = Math.max(...Object.values(deliveryByCycle), deliveryMeta);
                const h = Math.max(4, (val / maxD) * 80);
                const over = val > deliveryMeta;
                return (
                  <div key={c.id} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 4 }}>
                    <span style={{ fontSize: 10, color: over ? "#E24B4A" : "var(--text-muted)" }}>{fmtShort(val)}</span>
                    <div style={{ width: "100%", height: h, background: over ? "#E24B4A" : "#1D9E75", borderRadius: "4px 4px 0 0", transition: "height 0.3s" }} />
                    <span style={{ fontSize: 10, color: "var(--text-muted)" }}>{c.label}</span>
                  </div>
                );
              })}
            </div>
            <div style={{ borderTop: "1px dashed var(--border)", marginTop: 8, paddingTop: 4, fontSize: 11, color: "var(--text-muted)", textAlign: "center" }}>
              Linha de meta: {fmt(deliveryMeta)}/ciclo
            </div>
          </div>

          <div style={{ background: "var(--surface-2)", border: "0.5px solid var(--border)", borderRadius: 12, padding: "16px 20px" }}>
            <p style={{ fontSize: 14, fontWeight: 500, margin: "0 0 12px" }}>Distribuição por categoria {overviewCycle === "all" ? "(todos os ciclos)" : `(${CYCLES.find(c=>c.id===overviewCycle)?.label})`}</p>
            {byCatTotals.map(([cat, val]) => {
              const total = byCatTotals.reduce((s, [, v]) => s + v, 0);
              const pct = Math.round((val / total) * 100);
              const c = CATEGORIES[cat];
              const isSelected = selectedCat === cat;
              return (
                <div key={cat} style={{ marginBottom: 4 }}>
                  <div onClick={() => setSelectedCat(isSelected ? null : cat)} style={{ cursor: "pointer", padding: "4px 0", borderRadius: 6, transition: "background 0.15s" }}>
                    <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, marginBottom: 2 }}>
                      <span style={{ display: "flex", alignItems: "center", gap: 6 }}>
                        <span style={{ width: 8, height: 8, borderRadius: 2, background: c?.color || "#888", display: "inline-block" }} />
                        <span style={{ fontWeight: isSelected ? 500 : 400 }}>{c?.label || cat}</span>
                        <span style={{ fontSize: 10, color: "var(--text-muted)" }}>{isSelected ? "▲" : "▼"}</span>
                      </span>
                      <span style={{ color: "var(--text-secondary)" }}>{fmt(val)} ({pct}%)</span>
                    </div>
                    <ProgressBar pct={pct} color={c?.color} />
                  </div>
                  {isSelected && (() => {
                    const catExpenses = (overviewCycle === "all" ? expenses : expenses.filter(e => e.cycle === overviewCycle)).filter(e => e.cat === cat).sort((a, b) => {
                      const ca = CYCLES.findIndex(c => c.id === a.cycle);
                      const cb = CYCLES.findIndex(c => c.id === b.cycle);
                      return ca !== cb ? ca - cb : 0;
                    });
                    const catTotal = catExpenses.reduce((s, e) => s + e.value, 0);
                    return (
                      <div style={{ background: "var(--surface-1)", borderRadius: 8, padding: "8px 12px", margin: "6px 0 8px", maxHeight: 250, overflowY: "auto" }}>
                        <div style={{ display: "flex", justifyContent: "space-between", fontSize: 11, color: "var(--text-muted)", marginBottom: 6, padding: "0 0 4px", borderBottom: "0.5px solid var(--border)" }}>
                          <span>{catExpenses.length} lançamentos</span>
                          <span style={{ fontWeight: 500 }}>{fmt(catTotal)}</span>
                        </div>
                        {catExpenses.map((e, i) => (
                          <div key={i} style={{ display: "flex", alignItems: "center", gap: 8, padding: "5px 0", borderBottom: i < catExpenses.length - 1 ? "0.5px solid var(--border)" : "none", fontSize: 12 }}>
                            <span style={{ color: "var(--text-muted)", width: 38, flexShrink: 0, fontSize: 11 }}>{e.date}</span>
                            <span style={{ flex: 1, minWidth: 0, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{e.desc}</span>
                            {e.parcela && <span style={{ fontSize: 10, color: "var(--text-muted)", background: "var(--surface-2)", padding: "1px 5px", borderRadius: 6 }}>{e.parcela}</span>}
                            <span style={{ fontSize: 11, color: "var(--text-muted)", flexShrink: 0, width: 36, textAlign: "center" }}>{CYCLES.find(c => c.id === e.cycle)?.label}</span>
                            <span style={{ fontWeight: 500, flexShrink: 0, width: 68, textAlign: "right" }}>{fmt(e.value)}</span>
                          </div>
                        ))}
                      </div>
                    );
                  })()}
                </div>
              );
            })}
          </div>
        </>
      )}

      {tab === "expenses" && (
        <>
          <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 8 }}>
            <Pill label="Todos os ciclos" active={filterCycle === "all"} onClick={() => setFilterCycle("all")} />
            {CYCLES.map(c => <Pill key={c.id} label={c.label} active={filterCycle === c.id} onClick={() => setFilterCycle(c.id)} />)}
          </div>
          <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 12 }}>
            <Pill label="Todas" active={filterCat === "all"} onClick={() => setFilterCat("all")} />
            {Object.entries(CATEGORIES).map(([k, v]) => <Pill key={k} label={v.label} active={filterCat === k} onClick={() => setFilterCat(k)} color={v.color} />)}
          </div>

          <div style={{ background: "var(--surface-1)", borderRadius: "var(--radius)", padding: "8px 12px", marginBottom: 12, fontSize: 13 }}>
            <span style={{ color: "var(--text-secondary)" }}>{filtered.length} itens</span>
            <span style={{ float: "right", fontWeight: 500 }}>{fmt(totalFiltered)}</span>
          </div>

          <div style={{ maxHeight: 400, overflowY: "auto" }}>
            {filtered.map((e, i) => {
              const c = CATEGORIES[e.cat];
              return (
                <div key={i} style={{ display: "flex", alignItems: "center", gap: 8, padding: "8px 0", borderBottom: "0.5px solid var(--border)", fontSize: 13 }}>
                  <span style={{ width: 6, height: 6, borderRadius: 2, background: c?.color || "#888", flexShrink: 0 }} />
                  <span style={{ flex: 1, minWidth: 0, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                    {e.source === "whatsapp" && <span title="Lançado via WhatsApp" style={{ marginRight: 4 }}>💬</span>}
                    {e.desc}
                  </span>
                  {e.status === "pending_review" && <span title="Categorização incerta — confirme no grupo do WhatsApp" style={{ fontSize: 10, color: "var(--text-warning)", background: "var(--bg-warning)", padding: "1px 6px", borderRadius: 8 }}>revisar</span>}
                  {e.parcela && <span style={{ fontSize: 10, color: "var(--text-muted)", background: "var(--surface-1)", padding: "1px 6px", borderRadius: 8 }}>{e.parcela}</span>}
                  <span style={{ fontSize: 11, color: "var(--text-muted)", flexShrink: 0, width: 40, textAlign: "center" }}>
                    {CYCLES.find(c => c.id === e.cycle)?.label}
                  </span>
                  <span style={{ fontWeight: 500, flexShrink: 0, width: 72, textAlign: "right" }}>{fmt(e.value)}</span>
                </div>
              );
            })}
          </div>
        </>
      )}

      {tab === "goals" && (
        <>
          {GOALS.map(g => {
            const pct = Math.round((g.saved / g.target) * 100);
            const done = pct >= 100;
            return (
              <div key={g.id} style={{ background: "var(--surface-2)", border: "0.5px solid var(--border)", borderRadius: 12, padding: "16px 20px", marginBottom: 12 }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 4 }}>
                  <span style={{ fontWeight: 500, fontSize: 14 }}>{g.name}</span>
                  <span style={{ fontSize: 12, padding: "2px 8px", borderRadius: 8, background: done ? "var(--bg-success)" : "var(--bg-warning)", color: done ? "var(--text-success)" : "var(--text-warning)" }}>
                    {done ? "Concluída" : g.deadline}
                  </span>
                </div>
                <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, color: "var(--text-secondary)", marginBottom: 6 }}>
                  <span>{fmt(g.saved)} de {fmt(g.target)}</span>
                  <span>{pct}%</span>
                </div>
                <ProgressBar pct={pct} color={done ? "#1D9E75" : "#378ADD"} />
                {!done && g.id === "carro" && (
                  <p style={{ fontSize: 11, color: "var(--text-muted)", margin: "8px 0 0" }}>
                    Falta {fmt(g.target - g.saved)} · Financiar ~{fmt(g.target - g.saved)} em 36x (entrada + aportes até jan)
                  </p>
                )}
              </div>
            );
          })}

          <div style={{ background: "var(--surface-2)", border: "0.5px solid var(--border)", borderRadius: 12, padding: "16px 20px" }}>
            <p style={{ fontSize: 14, fontWeight: 500, margin: "0 0 12px" }}>Checkpoints mensais (saldo disponível p/ metas)</p>
            {CHECKPOINTS.map((cp, i) => (
              <div key={i} style={{ display: "flex", alignItems: "center", gap: 12, padding: "6px 0", borderBottom: i < CHECKPOINTS.length - 1 ? "0.5px solid var(--border)" : "none", fontSize: 13 }}>
                <span style={{ width: 60, color: "var(--text-secondary)" }}>{cp.cycle}</span>
                <div style={{ flex: 1 }}>
                  <ProgressBar pct={(cp.target / 10000) * 100} color="#378ADD" />
                </div>
                <span style={{ fontWeight: 500, width: 80, textAlign: "right" }}>{fmt(cp.target)}</span>
                {cp.cycle === "Jan/27" && <span>🚗</span>}
              </div>
            ))}
          </div>
        </>
      )}

      {tab === "aportes" && (
        <>
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 16 }}>
            <MetricCard label="Aporte médio" value={fmt(avgAporte)} sub="Fórmula: (Salário − Fatura − R$127) − R$1.000" />
            <MetricCard label="Com corte assinaturas" value={fmt(avgAporte + 123.39)} sub="+R$ 123,39/mês" color="#1D9E75" />
          </div>

          <div style={{ background: "var(--surface-2)", border: "0.5px solid var(--border)", borderRadius: 12, padding: "16px 20px", marginBottom: 16 }}>
            <p style={{ fontSize: 14, fontWeight: 500, margin: "0 0 12px" }}>Aporte real por ciclo</p>
            {aportes.map((a, i) => {
              const isNeg = a.aporte <= 0;
              const status = a.aporte >= 640 ? "🟢" : a.aporte >= 400 ? "🟡" : "🔴";
              return (
                <div key={a.id} style={{ display: "flex", alignItems: "center", gap: 8, padding: "8px 0", borderBottom: i < aportes.length - 1 ? "0.5px solid var(--border)" : "none", fontSize: 13 }}>
                  <span style={{ width: 20, textAlign: "center" }}>{status}</span>
                  <span style={{ width: 50, color: "var(--text-secondary)" }}>{a.label}</span>
                  <div style={{ flex: 1, display: "flex", flexDirection: "column", gap: 2 }}>
                    <div style={{ display: "flex", justifyContent: "space-between", fontSize: 11, color: "var(--text-muted)" }}>
                      <span>Fatura: {fmt(a.fatura)}</span>
                      <span>Aporte: {isNeg ? "R$ 0,00" : fmt(a.aporte)}</span>
                    </div>
                    <ProgressBar pct={Math.min(100, (a.aporte / 800) * 100)} color={isNeg ? "#E24B4A" : a.aporte >= 640 ? "#1D9E75" : "#BA7517"} />
                  </div>
                </div>
              );
            })}
          </div>

          <div style={{ background: "var(--surface-2)", border: "0.5px solid var(--border)", borderRadius: 12, padding: "16px 20px" }}>
            <p style={{ fontSize: 14, fontWeight: 500, margin: "0 0 12px" }}>Fórmula do ciclo</p>
            <table style={{ width: "100%", fontSize: 13, borderCollapse: "collapse" }}>
              <tbody>
                <tr><td style={{ padding: "4px 0", color: "var(--text-secondary)" }}>Salário líquido</td><td style={{ textAlign: "right", padding: "4px 0" }}>{fmt(SALARY)}</td></tr>
                <tr><td style={{ padding: "4px 0", color: "var(--text-secondary)" }}>(−) Fatura do cartão (média)</td><td style={{ textAlign: "right", padding: "4px 0", color: "#E24B4A" }}>−{fmt(avgFatura)}</td></tr>
                <tr><td style={{ padding: "4px 0", color: "var(--text-secondary)" }}>(−) Mensalidade terreiro</td><td style={{ textAlign: "right", padding: "4px 0", color: "#E24B4A" }}>−{fmt(TERREIRO)}</td></tr>
                <tr><td style={{ padding: "4px 0", color: "var(--text-secondary)" }}>(−) Orçamento mensal</td><td style={{ textAlign: "right", padding: "4px 0", color: "#E24B4A" }}>−{fmt(BUFFER)}</td></tr>
                <tr style={{ borderTop: "0.5px solid var(--border)" }}><td style={{ padding: "6px 0", fontWeight: 500 }}>(=) Aporte no cofrinho</td><td style={{ textAlign: "right", padding: "6px 0", fontWeight: 500, color: "#1D9E75" }}>{fmt(Math.max(0, SALARY - avgFatura - TERREIRO - BUFFER))}</td></tr>
              </tbody>
            </table>
          </div>
        </>
      )}
      {tab === "previsao" && (() => {
        const sum = (a, i) => a.reduce((t, x) => t + x[i], 0);
        const meses = FORECAST.map(m => {
          const fixasCartao = sum(FIXAS, 1), parcCartao = sum(m.parcelas, 1);
          const reemb = sum(FIXAS, 2) + sum(m.parcelas, 2);
          const faturaCartao = fixasCartao + parcCartao;
          const faturaLiquida = faturaCartao - reemb;
          const aporteMax = SALARY - faturaLiquida - GYMPASS - TERREIRO - BUFFER;
          const folga = Math.max(0, aporteMax - metaAporte);
          return { ...m, fixasCartao, parcCartao, reemb, faturaCartao, faturaLiquida, aporteMax, folga };
        });
        const row = (label, get, opts = {}) => (
          <tr style={{ borderTop: opts.top ? "0.5px solid var(--border)" : "none" }}>
            <td style={{ padding: "6px 0", color: opts.strong ? "var(--text-primary)" : "var(--text-secondary)", fontWeight: opts.strong ? 500 : 400 }}>{label}</td>
            {meses.map(m => <td key={m.id} style={{ textAlign: "right", padding: "6px 0", fontWeight: opts.strong ? 500 : 400, color: opts.color || "var(--text-primary)" }}>{get(m)}</td>)}
          </tr>
        );
        return (
          <>
            <div style={{ background: "var(--surface-2)", border: "0.5px solid var(--border)", borderRadius: 12, padding: "16px 20px", marginBottom: 16 }}>
              <p style={{ fontSize: 14, fontWeight: 500, margin: "0 0 4px" }}>Quanto ainda posso gastar no cartão</p>
              <p style={{ fontSize: 12, color: "var(--text-muted)", margin: "0 0 12px" }}>
                Gasto extra além das despesas fixas e parcelas já mapeadas, mantendo o aporte na meta.
              </p>
              <label style={{ fontSize: 12, color: "var(--text-secondary)", display: "flex", alignItems: "center", gap: 8, marginBottom: 14 }}>
                Meta de aporte por ciclo: R$
                <input type="number" value={metaAporte} onChange={e => setMetaAporte(Number(e.target.value) || 0)}
                  style={{ width: 90, padding: "4px 8px", borderRadius: 6, border: "0.5px solid var(--border)", background: "var(--surface-1)", color: "var(--text-primary)", fontSize: 13 }} />
              </label>
              <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                {meses.map(m => (
                  <MetricCard key={m.id} label={`${m.label} (${m.period})`} value={fmt(m.folga)}
                    sub={`≈ ${fmt(m.folga / (m.dias / 7))}/semana · ${fmt(m.folga / m.dias)}/dia`}
                    color={m.folga > 0 ? "#1D9E75" : "#E24B4A"} />
                ))}
              </div>
              <p style={{ fontSize: 11, color: "var(--text-muted)", margin: "12px 0 0" }}>
                Vale para compras no cartão (Uber, delivery, presentes, compras online). O orçamento de R$ 1.000 na conta é à parte.
              </p>
            </div>

            <div style={{ background: "var(--surface-2)", border: "0.5px solid var(--border)", borderRadius: 12, padding: "16px 20px", marginBottom: 16 }}>
              <p style={{ fontSize: 14, fontWeight: 500, margin: "0 0 12px" }}>Projeção só com o que já está mapeado</p>
              <div style={{ overflowX: "auto" }}>
                <table style={{ width: "100%", fontSize: 13, borderCollapse: "collapse", minWidth: 420 }}>
                  <thead>
                    <tr style={{ fontSize: 11, color: "var(--text-muted)" }}>
                      <th style={{ textAlign: "left", fontWeight: 400, padding: "4px 0" }}></th>
                      {meses.map(m => <th key={m.id} style={{ textAlign: "right", fontWeight: 400, padding: "4px 0" }}>{m.label}<br />venc {m.venc.slice(0, 5)}</th>)}
                    </tr>
                  </thead>
                  <tbody>
                    {row("Salário líquido", () => fmt(SALARY))}
                    {row("Despesas fixas (cartão)", m => fmt(m.fixasCartao))}
                    {row("Parcelas restantes", m => fmt(m.parcCartao))}
                    {row("Fatura no cartão", m => fmt(m.faturaCartao), { strong: true, top: true })}
                    {row("(−) Reembolsos (mãe, irmão, namorada)", m => `−${fmt(m.reemb)}`, { color: "#1D9E75" })}
                    {row("Fatura líquida", m => fmt(m.faturaLiquida), { strong: true, top: true })}
                    {row("(−) Gympass (repasse à namorada)", () => `−${fmt(GYMPASS)}`, { color: "#E24B4A" })}
                    {row("(−) Terreiro", () => `−${fmt(TERREIRO)}`, { color: "#E24B4A" })}
                    {row("(−) Orçamento mensal", () => `−${fmt(BUFFER)}`, { color: "#E24B4A" })}
                    {row("Aporte máximo (sem gasto extra)", m => fmt(m.aporteMax), { strong: true, top: true, color: "#1D9E75" })}
                    {row(`Meta de aporte`, () => fmt(metaAporte))}
                    {row("Folga para gastar", m => fmt(m.folga), { strong: true, color: "#1D9E75" })}
                  </tbody>
                </table>
              </div>
            </div>

            <div style={{ background: "var(--surface-2)", border: "0.5px solid var(--border)", borderRadius: 12, padding: "16px 20px", marginBottom: 16 }}>
              <p style={{ fontSize: 14, fontWeight: 500, margin: "0 0 8px" }}>O que está incluído</p>
              <p style={{ fontSize: 12, color: "var(--text-secondary)", margin: "0 0 6px" }}>Fixas mensais: {FIXAS.map(f => `${f[0]} ${fmtShort(f[1])}`).join(" · ")}</p>
              {meses.map(m => (
                <p key={m.id} style={{ fontSize: 12, color: "var(--text-secondary)", margin: "0 0 6px" }}>{m.label} — parcelas: {m.parcelas.map(f => `${f[0]} ${fmtShort(f[1])}`).join(" · ")}</p>
              ))}
              <p style={{ fontSize: 11, color: "var(--text-muted)", margin: "8px 0 0" }}>
                Atenção: confirmar até quando vai o Espaço Laser. Kindle+ e SCP Essencial ficaram de fora até serem identificados. TotalPass encerrado (agora Gympass, R$ 99 repassados à namorada).
              </p>
            </div>
          </>
        );
      })()}
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<Dashboard />);
</script>
</body>
</html>
